version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Routine dev-tooling bumps share one PR. Major versions stay out of the
      # group and arrive as separate PRs, since each one is its own migration.
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # Every @wordpress/* package below is a webpack external: the npm version is
      # never bundled, it only sets the API surface the build type-checks against.
      # That has to track the "Requires at least" WordPress version rather than the
      # latest release, so major bumps are not routine updates.
      # @wordpress/eslint-plugin is real dev tooling and is deliberately absent.
      - dependency-name: "@wordpress/api-fetch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/block-editor"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/blocks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/components"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/data"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/element"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wordpress/i18n"
        update-types: ["version-update:semver-major"]
      # react and react-dom are externals on the same terms, mapped to the React
      # and ReactDOM globals; WordPress core ships 18.3.1 as of 6.8. Their @types
      # packages track the runtime major and move with it.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
