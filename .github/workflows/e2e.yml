name: E2E

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Referenced by main's branch protection as a required status check, which
    # matches on this exact string. Renaming it here stops that check from ever
    # being reported, and the branch blocks with no failure to point at.
    name: Playwright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Build plugin
        run: npm run build:dev

      - name: Stage built plugin for wp-env
        # .wp-env.json points at ./dist/fotogrids; mirror the zip layout so the
        # site loads the actual built plugin, not the raw repo tree.
        run: |
          rm -rf dist/fotogrids
          mkdir dist/fotogrids
          find dist -mindepth 1 -maxdepth 1 ! -name fotogrids -exec cp -R {} dist/fotogrids/ \;

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        # No --with-deps: ubuntu-latest already carries every shared library
        # Chromium needs, and installing them costs ~12s per run. Verified by
        # launching the browser after a bare install.
        run: npx playwright install chromium

      - name: Start WordPress (wp-env)
        run: npm run env:start

      - name: Run Playwright tests
        run: npm run test:e2e

      # No teardown step: the runner is destroyed when the job ends, so
      # `wp-env stop` only added ~13s to every run.

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
