name: E2E

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: fotogrids_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    env:
      FG_DB_HOST: 127.0.0.1
      FG_DB_PORT: 3306
      FG_DB_USER: root
      FG_DB_NAME: fotogrids_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Set up PHP 8.1
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, gd, exif, zip, mbstring
          coverage: none

      - name: Build plugin
        run: npm run build:dev

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        # No --with-deps: ubuntu-latest already carries every shared library
        # Chromium needs, and installing them costs ~12s per run.
        run: npx playwright install chromium

      - name: Boot WordPress
        run: ./tests/harness/boot.sh --mode=ci

      - name: Run Playwright tests
        run: |
          set -a; . ./tests/harness/.env; set +a
          npm run test:e2e

      - name: Harness diagnostics
        if: failure()
        run: |
          echo '--- boot.sh --doctor ---'
          ./tests/harness/boot.sh --doctor || true
          echo '--- php server log ---'
          tail -50 tests/harness/.state/server.log || true
          echo '--- wordpress debug.log ---'
          tail -50 tests/harness/.state/wp/wp-content/debug.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
