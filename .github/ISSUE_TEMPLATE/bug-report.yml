name: 🐞 Bug report
description: Something in FotoGrids is broken or behaving incorrectly.
title: "[Bug]: "
labels: ["bug", "needs triage", "from-users"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please confirm this is a **bug**, not a feature request or a how-to.
        - 🚀 Feature idea → [Feature Requests discussion](../../discussions/new?category=feature-requests)
        - 🙏 How do I…? → [Q&A / Help discussion](../../discussions/new?category=q-a)
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before reporting
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I reproduced this with all other plugins disabled and a default theme.
          required: false
  - type: dropdown
    id: edition
    attributes:
      label: Which edition?
      options:
        - FotoGrids (Free)
        - FotoGrids Pro
        - Both
        - Not sure
    validations:
      required: true
  - type: textarea
    id: system-info
    attributes:
      label: System Info report
      description: |
        In WordPress, go to **FotoGrids → Tools → System Info** and press **Copy report**, then paste it here. It carries your FotoGrids, WordPress, server, database, theme and plugin details, so none of it has to be chased up later. Database credentials and license keys are left out of the report by design.

        If the site is too broken to reach that screen, say so here and fill in what you can.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: page-builder
    attributes:
      label: How is the gallery placed on the page?
      options:
        - Block editor (Gutenberg)
        - Elementor
        - Divi 5
        - Shortcode
        - Another page builder
        - Not sure
    validations:
      required: false
  - type: dropdown
    id: layout
    attributes:
      label: Which layout?
      description: The layout set on the gallery where this happens.
      options:
        - Grid
        - Masonry
        - Justified
        - Slider
        - Image Viewer
        - Single Item
        - Featured Item
        - Instant Photos
        - Album view
        - Happens on every layout
        - Not sure
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a gallery with…
        2. Set layout to…
        3. View on front end…
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened at the last step.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: What you saw instead, in as much detail as you can give.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Drag images or a short recording into this box to attach them. A recording of the broken behaviour usually saves a round of questions.
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console / PHP errors
      description: Any browser console errors or PHP notices (from debug.log). Optional but very helpful.
      render: shell
    validations:
      required: false
